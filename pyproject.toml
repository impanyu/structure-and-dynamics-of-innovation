[project]
name = "innovation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "requests>=2.32",
    "pyyaml>=6",
    "anthropic>=0.40",
    "sentence-transformers>=3",
    "openai>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/innovation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: touches network or downloads models"]
