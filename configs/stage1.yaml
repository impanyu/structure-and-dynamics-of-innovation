# Stage 1 (spec §2): small-field corpus, cutoff aligned to model training cutoff.
mailto: impanyu@gmail.com
data_dir: data/stage1
# Initial graph: one small, coherent subfield (spec §2) so innovation dynamics
# are observable on a dense, bounded network. Evaluation still searches the
# WHOLE literature (spec §3.6). corpus.mode "venues" instead downloads the
# recognized_venues list itself (not used for Stage 1).
corpus:
  mode: field
  field_query: "federated learning"
  min_citations: 10        # admission floor: citations > this (venue list is NOT a download filter)
# Recognition list — EVALUATION ONLY, never a download filter. A search-
# verified realization counts as a hit iff it was published in one of these
# venues (alias substring match against the search result's venue string) OR
# its citations reach eval.recognized_min_citations. Also the recall
# denominator. Composition per CCF 7th edition (2026-03): AI category A-class
# (AAAI, NeurIPS, ACL, CVPR, ICCV, ICML, ICLR — ICLR newly promoted to A;
# IJCAI demoted to B and therefore EXCLUDED) + SIGKDD (DB/DM category A).
# COLM and RLC are NOT in CCF (too new, both founded 2024) — kept as explicit
# beyond-CCF additions for the LLM/RL fields; delete the two lines to drop
# them. `name` is the OpenAlex-resolvable form used for the denominator
# (COLM/RLC lack OpenAlex sources; their alias still recognizes hits, they
# just don't enter the denominator).
recognized_venues:
  - {name: "AAAI Conference on Artificial Intelligence", aliases: ["aaai"]}
  - {name: "Neural Information Processing Systems", aliases: ["neurips", "neural information processing"]}
  - {name: "Annual Meeting of the Association for Computational Linguistics", aliases: ["annual meeting of the association for computational linguistics"]}
  - {name: "Computer Vision and Pattern Recognition", aliases: ["computer vision and pattern recognition", "cvpr"]}
  - {name: "IEEE International Conference on Computer Vision", aliases: ["international conference on computer vision", "iccv"]}
  - {name: "International Conference on Machine Learning", aliases: ["international conference on machine learning", "icml"]}
  - {name: "International Conference on Learning Representations", aliases: ["international conference on learning representations", "iclr"]}
  - {name: "Knowledge Discovery and Data Mining", aliases: ["knowledge discovery and data mining", "kdd"]}
  - {name: "Conference on Language Modeling", aliases: ["conference on language modeling", "colm"]}
  - {name: "Reinforcement Learning Conference", aliases: ["reinforcement learning conference"]}
year_from: 2016
cutoff_year: 2024        # last full year in the graph
cutoff_date: "2025-01-01"  # anticipation boundary = agent model training cutoff
models:
  summarizer: claude-haiku-4-5-20251001
  agent: claude-sonnet-5
  judge: claude-sonnet-5
embedding_model: BAAI/bge-small-en-v1.5
eval:
  n_queries: 3
  top_k: 5
  dup_ceiling: 0.95
  arxiv_min_citations: 10
  recognized_min_citations: 10  # OR-arm of hit recognition: impact floor for unlisted venues
  arxiv_source_name: arXiv
run:
  run_id: stage1-pilot
  seed: 0
  total_steps: 200
  generation_budget: 20
  # Behavior profiles (spec §3.5). A region is EITHER a community list
  # (read_communities / write_communities: Louvain ids) OR a semantic region
  # (read_topics / write_topics: topic strings embedded as anchors, with
  # read_radius / write_radius as cosine-distance radii, default 0.3).
  # allow_jump gates sample_frontier. Examples:
  #   specialist (semantic):   {read_topics: ["personalized federated learning"],
  #                             read_radius: 0.25, write_topics: [...], write_radius: 0.25}
  #   broad reader/loc writer: {write_topics: ["federated learning privacy"]}
  #   specialist (community):  {read_communities: [0], write_communities: [0]}
  #   generalist, no jumps:    {allow_jump: false}
  agents:
    - {agent_id: a0, policy: llm}
    - {agent_id: a1, policy: llm}
    - {agent_id: a2, policy: llm}
    - {agent_id: a3, policy: llm}
    - {agent_id: a4, policy: llm}
out_dir: runs
