# Stage 1 (spec §2): NeurIPS + ICLR slice, cutoff aligned to model training cutoff.
mailto: impanyu@gmail.com
data_dir: data/stage1
# Initial graph: one small, coherent subfield (spec §2) so innovation dynamics
# are observable on a dense, bounded network. Evaluation still searches the
# WHOLE literature (spec §3.6). Switch corpus.mode to "venues" to use the venue
# list below instead.
corpus:
  mode: field
  field_query: "federated learning"
  min_citations: 10        # admission: in top-venue list OR citations > this floor
# Venue list: used for the field-corpus venue arm and the recall-denominator
# population count. Names audited 2026-08 to resolve to CONSOLIDATED OpenAlex
# sources (top search hit). Known gaps — OpenAlex fragments ACL/EMNLP/CVPR/ICCV
# into per-year proceedings and lacks UAI/COLM/RLC entirely; Semantic Scholar
# fallback is the spec §5 mitigation if the venue arm needs to be complete.
# Composition follows the CCF recommended list (2022, AI category) for the
# AI/ML/DL/RL/LLM scope: CCF-A (AAAI, NeurIPS, ACL, CVPR, ICCV, ICML, IJCAI,
# KDD) + relevant CCF-B (EMNLP, NAACL, ECCV, UAI, AAMAS, COLT) + essential
# venues CCF omits (ICLR, AISTATS, COLM, RLC, CoRL). Names below are the
# OpenAlex-resolvable subset; UAI/COLT/COLM/RLC have no OpenAlex source and
# ACL/EMNLP/CVPR/ICCV resolve only to per-year fragments (S2 fallback later).
venues:
  - "AAAI Conference on Artificial Intelligence"
  - "Neural Information Processing Systems"
  - "Annual Meeting of the Association for Computational Linguistics"
  - "Computer Vision and Pattern Recognition"
  - "IEEE International Conference on Computer Vision"
  - "International Conference on Machine Learning"
  - "International Joint Conference on Artificial Intelligence"
  - "Knowledge Discovery and Data Mining"
  - "Conference on Empirical Methods in Natural Language Processing"
  - "North American Chapter of the Association for Computational Linguistics"
  - "European Conference on Computer Vision"
  - "International Conference on Autonomous Agents and Multiagent Systems"
  - "International Conference on Learning Representations"
  - "International Conference on Artificial Intelligence and Statistics"
  - "Conference on Robot Learning"
year_from: 2016
cutoff_year: 2024        # last full year in the graph
cutoff_date: "2025-01-01"  # anticipation boundary = agent model training cutoff
models:
  summarizer: claude-haiku-4-5-20251001
  agent: claude-sonnet-5
  judge: claude-sonnet-5
embedding_model: BAAI/bge-small-en-v1.5
eval:
  n_queries: 3
  top_k: 5
  dup_ceiling: 0.95
  arxiv_min_citations: 10
  arxiv_source_name: arXiv
run:
  run_id: stage1-pilot
  seed: 0
  total_steps: 200
  generation_budget: 20
  # Behavior profiles (spec §3.5). A region is EITHER a community list
  # (read_communities / write_communities: Louvain ids) OR a semantic region
  # (read_topics / write_topics: topic strings embedded as anchors, with
  # read_radius / write_radius as cosine-distance radii, default 0.3).
  # allow_jump gates sample_frontier. Examples:
  #   specialist (semantic):   {read_topics: ["personalized federated learning"],
  #                             read_radius: 0.25, write_topics: [...], write_radius: 0.25}
  #   broad reader/loc writer: {write_topics: ["federated learning privacy"]}
  #   specialist (community):  {read_communities: [0], write_communities: [0]}
  #   generalist, no jumps:    {allow_jump: false}
  agents:
    - {agent_id: a0, policy: llm}
    - {agent_id: a1, policy: llm}
    - {agent_id: a2, policy: llm}
    - {agent_id: a3, policy: llm}
    - {agent_id: a4, policy: llm}
out_dir: runs
