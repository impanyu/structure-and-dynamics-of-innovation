# Stage 1 (spec §2): broad top-venue AI/ML corpus, cutoff aligned to model training cutoff.
mailto: impanyu@gmail.com
data_dir: data/stage1
# Initial corpus = broad AI/ML/DL/LLM coverage from four core top venues via
# Semantic Scholar (OpenAlex venue coverage is fragmented). Budget ~20k papers:
# 2020-2024 + citation floor 25 gives ~18.7k raw across the four venues
# (probed 2026-08-29), landing ~15-17k after the cutoff-month and abstract
# filters. (Older modes "field"/"venues" remain available for ablations.)
corpus:
  mode: s2_venues
  venues:
    - "Neural Information Processing Systems"
    - "International Conference on Learning Representations"
    - "International Conference on Machine Learning"
    - "AAAI Conference on Artificial Intelligence"
  min_citations: 25
# Recognition list — EVALUATION ONLY, never a download filter. A search-
# verified realization counts as a hit iff it was published in one of these
# venues (alias substring match against the search result's venue string) OR
# its citations reach eval.recognized_min_citations. Composition: ALL 58
# CCF-A conferences (7th edition, 2026-03, every category) + COLM/RLC (2024-
# founded LLM/RL venues CCF has not yet rated). Broad recognition costs
# nothing and credits cross-domain realizations (e.g. an ML-systems idea
# realized at OSDI). Headline metric is ACCURACY (precision) only — recall
# was dropped by design decision 2026-08-28.
