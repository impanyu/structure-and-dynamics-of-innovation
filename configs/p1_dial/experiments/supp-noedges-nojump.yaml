# Supplementary — combined ablation (2x2 corner): no initial edges AND no
# random jumps. Search is the only navigation channel; browse degenerates
# to reading a node, sample_frontier returns a restriction error.
extends: core-generalists.yaml
run:
  run_id: supp-noedges-nojump
  init_edges: none
  agents:
    - {agent_id: g0, policy: llm, allow_jump: false}
    - {agent_id: g1, policy: llm, allow_jump: false}
    - {agent_id: g2, policy: llm, allow_jump: false}
    - {agent_id: g3, policy: llm, allow_jump: false}
    - {agent_id: g4, policy: llm, allow_jump: false}
    - {agent_id: g5, policy: llm, allow_jump: false}
    - {agent_id: g6, policy: llm, allow_jump: false}
    - {agent_id: g7, policy: llm, allow_jump: false}
    - {agent_id: g8, policy: llm, allow_jump: false}
    - {agent_id: g9, policy: llm, allow_jump: false}
