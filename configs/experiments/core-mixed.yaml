# C4 — 混编团队: 4 specialists (4 distinct topics) + 3 broad writers + 3
# generalists. Each agent jumps within its own readable scope.
extends: ../stage1.yaml
run:
  run_id: core-mixed
  seed: 0
  total_steps: 400
  generation_budget: 40
  agents:
    - {agent_id: s0, policy: llm, read_topics: ["large language models and natural language reasoning"], read_radius: 0.3, write_topics: ["large language models and natural language reasoning"], write_radius: 0.3}
    - {agent_id: s1, policy: llm, read_topics: ["computer vision and generative image models"], read_radius: 0.3, write_topics: ["computer vision and generative image models"], write_radius: 0.3}
    - {agent_id: s2, policy: llm, read_topics: ["reinforcement learning and sequential decision making"], read_radius: 0.3, write_topics: ["reinforcement learning and sequential decision making"], write_radius: 0.3}
    - {agent_id: s3, policy: llm, read_topics: ["graph neural networks and efficient deep learning architectures"], read_radius: 0.3, write_topics: ["graph neural networks and efficient deep learning architectures"], write_radius: 0.3}
    - {agent_id: b0, policy: llm, write_topics: ["large language models and natural language reasoning"], write_radius: 0.3}
    - {agent_id: b1, policy: llm, write_topics: ["reinforcement learning and sequential decision making"], write_radius: 0.3}
    - {agent_id: b2, policy: llm, write_topics: ["adversarial robustness and trustworthy machine learning"], write_radius: 0.3}
    - {agent_id: g0, policy: llm}
    - {agent_id: g1, policy: llm}
    - {agent_id: g2, policy: llm}
