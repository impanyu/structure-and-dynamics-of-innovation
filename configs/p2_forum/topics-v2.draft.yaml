# DRAFT topic list built from configs/p2_forum/venue_areas.yaml by
# scripts/p2_forum/build_topic_list.py. Review, edit, then rename to
# topics-v2.yaml to freeze it (ids = list positions).
topics:
- name: Deep Learning Architectures
  definition: Covers neural network architecture design and general deep learning techniques; excludes
    training optimization algorithms and generative modeling specifics.
  sources:
  - NeurIPS
  - ICML
  - CVPR
  - ICCV
  - AAAI
- name: Generative Models
  definition: Covers generative modeling approaches including GANs, diffusion, VAEs, and autoregressive
    generative methods; excludes discriminative representation learning.
  sources:
  - NeurIPS
  - ICLR
  - AAAI
  - ICML
- name: Foundation Models and LLMs
  definition: Covers large-scale pretrained foundation models and large language models, their architectures
    and properties; excludes narrow task-specific NLP applications.
  sources:
  - NeurIPS
  - AAAI
  - CVPR
- name: Representation Learning
  definition: Covers unsupervised, self-supervised, semi-supervised and supervised learning of general-purpose
    representations; excludes domain-specific vision/language representation subtopics covered elsewhere.
  sources:
  - ICLR
  - CVPR
  - ICCV
  - AAAI
- name: Self- and Semi-Supervised Learning
  definition: Covers methods that learn from unlabeled or partially labeled data including self-, semi-,
    and meta-supervised schemes; excludes fully supervised classification methods.
  sources:
  - CVPR
  - ICCV
  - AAAI
- name: Transfer and Multi-Task Learning
  definition: Covers transfer learning, domain adaptation, multi-task and lifelong/continual learning;
    excludes meta-learning algorithms covered under meta-learning topic.
  sources:
  - ICLR
  - CVPR
  - ICCV
  - AAAI
- name: Meta-Learning
  definition: Covers learning-to-learn approaches and few-shot adaptation algorithms; excludes general
    transfer learning and continual learning.
  sources:
  - ICLR
- name: General Supervised and Unsupervised Learning
  definition: Covers classical supervised/unsupervised learning paradigms such as classification, clustering,
    ranking, online and active learning not tied to deep architectures.
  sources:
  - NeurIPS
  - ICML
  - ICLR
  - AAAI
- name: Clustering and Dimensionality Reduction
  definition: Covers clustering algorithms, feature selection and dimensionality reduction techniques;
    excludes supervised classification/regression.
  sources:
  - AAAI
- name: Metric and Kernel Learning
  definition: Covers metric learning, kernel methods and sparse coding; excludes deep representation learning
    methods.
  sources:
  - ICLR
  - AAAI
- name: Ensemble and Multi-Instance Learning
  definition: Covers ensemble methods, multi-instance and multi-view learning approaches; excludes single-model
    supervised learning.
  sources:
  - AAAI
- name: Optimization for Machine Learning
  definition: Covers convex and non-convex, stochastic, distributed and other optimization algorithms
    applied to ML, excluding optimization theory proofs covered under learning theory.
  sources:
  - NeurIPS
  - ICML
  - ICLR
  - AAAI
  - CVPR
  - ICCV
- name: Learning Theory
  definition: Covers statistical learning theory, generalization bounds, bandits and game-theoretic learning
    theory; excludes applied optimization algorithms.
  sources:
  - NeurIPS
  - ICML
  - ICLR
  - AAAI
- name: Probabilistic Inference Methods
  definition: Covers Bayesian inference, variational inference, Monte Carlo methods, graphical models
    and probabilistic programming; excludes causal inference as a standalone topic.
  sources:
  - NeurIPS
  - ICML
  - ICLR
  - AAAI
- name: Causal Inference and Reasoning
  definition: Covers causal discovery, causal effect estimation and causal reasoning methods; excludes
    general probabilistic graphical models.
  sources:
  - NeurIPS
  - ICLR
  - AAAI
- name: Uncertainty Quantification and Calibration
  definition: Covers methods for estimating and calibrating predictive uncertainty; excludes general Bayesian
    modeling techniques.
  sources:
  - ICLR
  - AAAI
- name: Graph and Relational Learning
  definition: Covers learning on graphs, geometric/topological learning, graph mining and relational/statistical
    relational learning; excludes knowledge graph completion covered separately.
  sources:
  - ICLR
  - AAAI
- name: Knowledge Graphs and Linked Data
  definition: Covers knowledge graph construction, completion, and linked/semantic web data representation;
    excludes general graph mining algorithms.
  sources:
  - AAAI
- name: Reinforcement Learning
  definition: Covers reinforcement learning algorithms, deep RL, hierarchical RL, bandits applied to control,
    and decision/control problems; excludes multi-agent RL covered separately.
  sources:
  - NeurIPS
  - ICML
  - ICLR
  - AAAI
- name: Imitation and Inverse RL
  definition: Covers imitation learning and inverse reinforcement learning methods; excludes standard
    reward-based RL algorithms.
  sources:
  - AAAI
- name: Neuro-Symbolic and Hybrid AI
  definition: Covers integration of symbolic reasoning with neural methods, physics-informed and logic-based
    hybrid systems; excludes pure symbolic knowledge representation.
  sources:
  - ICLR
  - AAAI
  - ICCV
- name: Federated and Distributed Learning
  definition: Covers federated learning and distributed training/inference systems for ML; excludes general
    infrastructure/software libraries.
  sources:
  - AAAI
  - NeurIPS
- name: ML Infrastructure and Systems
  definition: Covers libraries, hardware, implementation, and system-level infrastructure for machine
    learning; excludes algorithmic contributions.
  sources:
  - NeurIPS
  - ICLR
  - AAAI
- name: Model Compression and Edge Learning
  definition: Covers model compression, quantization, and learning for deployment on edge/resource-constrained
    devices; excludes general training algorithms.
  sources:
  - AAAI
- name: AutoML and Hyperparameter Optimization
  definition: Covers automated machine learning pipelines and hyperparameter tuning methods; excludes
    manual architecture design.
  sources:
  - AAAI
- name: Evaluation Methodology and Benchmarks
  definition: Covers methodology for evaluating ML models, replicability, meta-studies, datasets and benchmark
    creation; excludes domain-specific dataset papers.
  sources:
  - NeurIPS
  - ICLR
  - AAAI
  - CVPR
  - ICCV
- name: Interpretability and Explainability
  definition: Covers methods for interpreting, explaining and visualizing model behavior and representations;
