  sources:
  - NeurIPS
  - ICML
  - ICLR
  - AAAI
  - CVPR
- name: Privacy-Preserving Machine Learning
  definition: Covers differential privacy, secure computation and privacy-preserving training/inference;
    excludes general security attacks.
  sources:
  - NeurIPS
  - ICML
  - ICLR
  - AAAI
  - CVPR
- name: Adversarial Robustness
  definition: Covers adversarial attacks, defenses and robustness evaluation of ML models; excludes general
