# Paper 2, online literature + hard topic gating
# (docs/superpowers/specs/2026-09-30-online-literature-topic-gating-design.md).
extends: base.yaml
literature: online
gating: topics
topics_file: configs/p2_forum/topics-v2.yaml
online:
  cache_dir: data/online_cache
  max_pub_date: "2024-09-30"
  search_pool: 50
# Reading scope = the evaluation's tier-1 rule: top-level recognized_venues
# (CCF-A, inherited) OR eval.recognized_min_citations, AND date <= max_pub_date.
eval:
  exclude_workshops: true
models:
  agent: openai:gpt-5:medium
  tagger: "claude-sonnet-5:medium"
  judge: claude-opus-5-5
