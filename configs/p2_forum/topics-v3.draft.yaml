  - venue: CVPR
    area: 'Recognition: Categorization, detection, retrieval'
- name: Robotics in Computer Vision
  definition: Covers vision techniques applied to robotic perception and control, excluding autonomous
    driving-specific vision tasks.
  sources:
  - venue: CVPR
    area: Robotics
- name: Segmentation, Grouping and Shape Analysis
  definition: Covers pixel grouping, segmentation, and shape analysis methods, excluding recognition tasks
    like detection and classification.
