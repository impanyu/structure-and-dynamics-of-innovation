# DRAFT (synonym-only dedupe; umbrellas kept). Review, then rename to
# topics-v3.yaml to freeze; ids = list positions.
# Built from configs/p2_forum/venue_areas.yaml by
# scripts/p2_forum/build_topics_v3.py.
# Dropped catch-all bins (15):
#   AAAI: APP: Other Applications
#   AAAI: CMS: Other Foundations of Cognitive Modeling & Syste
#   AAAI: CV: Other Foundations of Computer Vision
#   AAAI: CSO: Other Foundations of Constraint Satisfaction
#   AAAI: DMKM: Other Foundations of Data Mining & Knowledge Mana
#   AAAI: GTEP: Other Foundations of Game Theory & Economic Parad
#   AAAI: HAI: Other Foundations of Human Computation & AI
#   AAAI: ROB: Other Foundations and Applications
#   AAAI: KRR: Other Foundations of Knowledge Representation &
#   AAAI: ML: Other Foundations of Machine Learning
#   AAAI: MAS: Other Foundations of Multi Agent Systems
#   AAAI: PRS: Other Foundations of Planning, Routing & Scheduling
#   AAAI: RU: Other Foundations of Reasoning under Uncertainty
#   AAAI: SO: Other Foundations of Search & Optimization
#   AAAI: NLP: Other
topics:
- name: Machine Learning Applications
  definition: Covers applied ML work in domains like vision, language, speech, creative AI, computational
    biology, healthcare, neuroscience, social good, and climate science, excluding purely methodological
    contributions found in Deep Learning or General Machine Learning.
  sources:
  - venue: NeurIPS
    area: Applications (e.g., vision, language, speech and audio, Creative AI)
  - venue: ICML
    area: Applications (computational biology, crowdsourcing, healthcare, neuroscience, social good, climate
      science, etc.)
- name: Deep Learning
  definition: Covers deep network architectures, generative models, optimization for deep networks, foundation
    models, LLMs, and deep reinforcement learning, excluding classical (non-deep) general ML methods.
  sources:
  - venue: NeurIPS
    area: Deep learning (e.g., architectures, generative models, optimization for deep networks, foundation
      models, LLMs)
  - venue: ICML
    area: Deep Learning (architectures, generative models, deep reinforcement learning, etc.)
  - venue: AAAI
    area: 'ML: Deep Learning Algorithms'
- name: Evaluation and Analysis of ML Methods
  definition: Covers methodology for evaluating ML systems, meta studies, replicability, validity, and
    human-in-the-loop evaluation, excluding the development of new learning algorithms themselves.
  sources:
  - venue: NeurIPS
    area: Evaluation (e.g., methodology, meta studies, replicability and validity, human-in-the-loop)
  - venue: AAAI
    area: 'ML: Evaluation and Analysis'
- name: General Machine Learning
  definition: Covers broad core ML paradigms such as supervised, unsupervised, active, online, semi- and
    self-supervised learning, clustering, ranking, and time series analysis not covered by more specific
    topics like Deep Learning or Reinforcement Learning.
  sources:
  - venue: NeurIPS
    area: General machine learning (supervised, unsupervised, online, active, etc.)
  - venue: ICML
    area: General Machine Learning (active learning, clustering, online learning, ranking, reinforcement
      learning, supervised, semi- and self-supervised learning, time series analysis, etc.)
  - venue: ICLR
    area: general machine learning (i.e., none of the above)
- name: ML Infrastructure and Software
  definition: Covers libraries, improved implementations, scalability, distributed solutions, and hardware
    for machine learning, excluding algorithmic contributions themselves.
  sources:
  - venue: NeurIPS
    area: Infrastructure (e.g., libraries, improved implementation and scalability, distributed solutions)
  - venue: ICLR
    area: infrastructure, software libraries, hardware, etc.
- name: Machine Learning for Sciences
  definition: Covers ML applications to climate, health, life sciences, physics, and social sciences,
    excluding general applications like vision or language covered elsewhere.
  sources:
  - venue: NeurIPS
    area: Machine learning for sciences (e.g. climate, health, life sciences, physics, social sciences)
- name: Neuroscience and Cognitive Science in ML
  definition: Covers ML topics like neural coding and brain-computer interfaces connecting machine learning
    with neuroscience and cognitive science, excluding general healthcare applications.
  sources:
  - venue: NeurIPS
    area: Neuroscience and cognitive science (e.g., neural coding, brain-computer interfaces)
- name: Optimization for Machine Learning
  definition: Covers convex and non-convex optimization, stochastic, robust, online, non-smooth, and composite
    optimization methods and matrix/tensor methods, excluding learning theory analysis of such methods.
  sources:
  - venue: NeurIPS
    area: Optimization (e.g., convex and non-convex, stochastic, robust)
  - venue: ICML
    area: Optimization (convex and non-convex optimization, matrix/tensor methods, stochastic, online,
      non-smooth, composite, etc.)
  - venue: ICLR
    area: optimization
  - venue: AAAI
    area: 'ML: Optimization'
- name: Probabilistic Methods and Inference
  definition: Covers variational inference, causal inference, Gaussian processes, Bayesian methods, graphical
    models, Monte Carlo methods, and uncertainty quantification, excluding dedicated causal reasoning
    topics focused purely on causal discovery.
  sources:
  - venue: NeurIPS
    area: Probabilistic methods (e.g., variational inference, causal inference, Gaussian processes)
  - venue: ICML
    area: Probabilistic Inference (Bayesian methods, graphical models, Monte Carlo methods, etc.)
  - venue: ICLR
    area: probabilistic methods (Bayesian methods, variational inference, sampling, UQ, etc.)
- name: Reinforcement Learning
  definition: Covers decision and control, planning, hierarchical RL, robotics-related RL, and general
    reinforcement learning algorithms, excluding deep RL architectures classified under Deep Learning.
  sources:
  - venue: NeurIPS
    area: Reinforcement learning (e.g., decision and control, planning, hierarchical RL, robotics)
  - venue: ICLR
    area: reinforcement learning
  - venue: AAAI
    area: 'ML: Reinforcement Learning'
- name: Social and Trustworthy Aspects of Machine Learning
  definition: Covers fairness, interpretability, human-AI interaction, privacy, safety, strategic behavior,
    accountability, causality in trust contexts, and robustness, excluding pure causal reasoning methodology.
  sources:
  - venue: NeurIPS
    area: Social and economic aspects of machine learning (e.g., fairness, interpretability, human-AI
      interaction, privacy, safety, strategic behavior)
  - venue: ICML
    area: Trustworthy Machine Learning (accountability, causality, fairness, privacy, robustness, etc.)
  - venue: ICLR
    area: societal considerations including fairness, safety, privacy
- name: Learning Theory
  definition: Covers control theory, statistical learning theory, bandits, algorithmic game theory, and
    theoretical foundations of learning, excluding applied optimization methods themselves.
  sources:
  - venue: NeurIPS
    area: Theory (e.g., control theory, learning theory, algorithmic game theory)
  - venue: ICML
    area: Learning Theory (bandits, game theory, statistical learning theory, etc.)
  - venue: ICLR
    area: learning theory
  - venue: AAAI
    area: 'ML: Learning Theory'
- name: Representation Learning
  definition: Covers unsupervised, self-supervised, semi-supervised, and supervised representation learning
    techniques in general, excluding modality-specific representation learning for vision, audio, or language
    covered separately.
  sources:
  - venue: ICLR
    area: unsupervised, self-supervised, semi-supervised, and supervised representation learning
  - venue: AAAI
    area: 'ML: Representation Learning'
- name: Transfer, Meta, and Lifelong Learning
  definition: Covers transfer learning, meta learning, and lifelong (continual) learning methods, excluding
    general representation learning not focused on adaptation across tasks.
  sources:
  - venue: ICLR
    area: transfer learning, meta learning, and lifelong learning
- name: Representation Learning for Specific Modalities
  definition: Covers representation learning tailored to computer vision, audio, language, and other specific
    modalities, excluding generic modality-agnostic representation learning.
  sources:
  - venue: ICLR
    area: representation learning for computer vision, audio, language, and other modalities
- name: Metric, Kernel, and Sparse Coding Learning
  definition: Covers metric learning, kernel learning, and sparse coding methods, excluding broader general
    representation learning techniques.
  sources:
  - venue: ICLR
    area: metric learning, kernel learning, and sparse coding
- name: Deep Generative Models and Autoencoders
  definition: Covers generative models including deep generative models and autoencoders, excluding probabilistic
    inference methods not focused on generation.
  sources:
  - venue: ICLR
    area: generative models
  - venue: AAAI
    area: 'ML: Deep Generative Models & Autoencoders'
- name: Causal Reasoning and Learning
  definition: Covers causal reasoning, causal learning, and causality under uncertainty, excluding general
    probabilistic inference methods not centered on causality.
  sources:
  - venue: ICLR
    area: causal reasoning
  - venue: AAAI
    area: 'ML: Causal Learning'
  - venue: AAAI
    area: 'RU: Causality'
- name: Graph-based Machine Learning
  definition: Covers learning on graphs and other geometries and topologies, including graph-based ML
    methods, excluding generic representation learning for non-graph modalities.
  sources:
  - venue: ICLR
    area: learning on graphs and other geometries & topologies
  - venue: AAAI
    area: 'ML: Graph-based Machine Learning'
- name: Visualization and Interpretation of Representations
  definition: Covers methods for visualizing or interpreting learned representations, excluding broader
    interpretability work classified under social/trustworthy ML aspects.
  sources:
  - venue: ICLR
    area: visualization or interpretation of learned representations
- name: Datasets and Benchmarks
  definition: Covers the creation, curation, and analysis of datasets and benchmarks for ML research,
    excluding evaluation methodology topics focused on meta-analysis.
  sources:
  - venue: ICLR
    area: datasets and benchmarks
- name: Neurosymbolic and Hybrid AI Systems
  definition: Covers physics-informed models, logic and formal reasoning integration, and other hybrid
    neurosymbolic AI systems, excluding purely statistical deep learning architectures.
  sources:
  - venue: ICLR
    area: neurosymbolic & hybrid AI systems (physics-informed, logic & formal reasoning, etc.)
- name: Applications to Robotics, Autonomy, and Planning
  definition: Covers ML applications specifically targeting robotics, autonomous systems, and planning,
    excluding general reinforcement learning methodology not tied to application domains.
  sources:
  - venue: ICLR
    area: applications to robotics, autonomy, planning
- name: Applications to Neuroscience and Cognitive Science
  definition: Covers ML applications addressing neuroscience and cognitive science problems, excluding
    core methodological neuroscience-inspired learning topics listed elsewhere.
  sources:
  - venue: ICLR
    area: applications to neuroscience & cognitive science
- name: Applications to Physical Sciences
  definition: Covers ML applications to physics, chemistry, biology, and related physical sciences, excluding
    general machine-learning-for-science topics covering health and social science independently categorized
    elsewhere.
  sources:
  - venue: ICLR
    area: applications to physical sciences (physics, chemistry, biology, etc.)
- name: Humanities and Computational Social Science
  definition: Covers AI/ML applications to humanities and computational social science research, excluding
    general social good applications listed under Applications.
  sources:
  - venue: AAAI
    area: 'APP: Humanities & Computational Social Science'
- name: Internet of Things, Sensor Networks, and Smart Cities
  definition: Covers AI applications to IoT, sensor networks, and smart city systems, excluding generic
    infrastructure topics about ML systems themselves.
  sources:
  - venue: AAAI
    area: 'APP: Internet of Things, Sensor Networks & Smart Cities'
- name: Misinformation and Fake News
  definition: Covers detection and analysis of misinformation and fake news, excluding general social
    network analysis not focused on false information.
  sources:
  - venue: AAAI
    area: 'APP: Misinformation & Fake News'
- name: Mobility, Driving, and Flight
  definition: Covers AI applications to mobility, autonomous driving, and flight systems, excluding broader
    transportation logistics topics.
  sources:
  - venue: AAAI
    area: 'APP: Mobility, Driving & Flight'
- name: Natural Sciences Applications
  definition: Covers AI applications to natural sciences broadly, excluding specific physical science
    applications under dedicated ML venues like ICLR's physical sciences topic.
  sources:
  - venue: AAAI
    area: 'APP: Natural Sciences'
- name: Security Applications
  definition: Covers AI applications to security problems such as cybersecurity and threat detection,
    excluding misinformation-specific topics.
  sources:
  - venue: AAAI
    area: 'APP: Security'
- name: Social Networks Applications
  definition: Covers AI applications analyzing or operating on social networks, excluding misinformation-specific
    analysis covered separately.
  sources:
  - venue: AAAI
    area: 'APP: Social Networks'
- name: Software Engineering Applications
  definition: Covers AI applications to software engineering tasks such as code generation and analysis,
    excluding general infrastructure/libraries topics for ML systems.
  sources:
  - venue: AAAI
    area: 'APP: Software Engineering'
- name: Transportation Applications
  definition: Covers AI applications to transportation systems broadly, excluding the more specific mobility,
    driving, and flight topic.
  sources:
  - venue: AAAI
    area: 'APP: Transportation'
- name: Web Applications and Mining
  definition: Covers AI and data mining applications centered on the web, excluding social network-specific
    or misinformation-specific applications.
  sources:
  - venue: AAAI
    area: 'APP: Web'
  - venue: AAAI
    area: 'DMKM: Web'
- name: Adaptive Behavior
  definition: Covers cognitive modeling of adaptive behavior in agents, excluding agent architecture design
    topics.
  sources:
  - venue: AAAI
    area: 'CMS: Adaptive Behavior'
- name: Affective Computing
  definition: Covers computational modeling and recognition of emotions and affect, excluding general
    cognitive modeling applications not focused on affect.
  sources:
  - venue: AAAI
    area: 'CMS: Affective Computing'
- name: Agent Architectures
  definition: Covers the design of cognitive and intelligent agent architectures, excluding adaptive behavior
    modeling specifically.
  sources:
  - venue: AAAI
    area: 'CMS: Agent Architectures'
- name: Analogy
  definition: Covers computational models of analogy-making and analogical reasoning, excluding general
    cognitive architecture topics.
  sources:
  - venue: AAAI
    area: 'CMS: Analogy'
- name: Cognitive Systems Applications
  definition: Covers applied work in cognitive modeling and cognitive systems research, excluding the
    specific sub-areas of adaptive behavior, affective computing, agent architectures, and analogy.
  sources:
  - venue: AAAI
    area: 'CMS: Applications'
- name: Computational Cognitive Architectures
  definition: Covers the design and study of integrated computational architectures modeling human cognitive
    processes, excluding narrower topics like Symbolic Representations or Agent Architectures.
  sources:
  - venue: AAAI
    area: 'CMS: (Computational) Cognitive Architectures'
- name: Computational Creativity
  definition: Covers computational models and systems that generate or evaluate creative artifacts and
    processes, excluding general Deep Generative Models unrelated to creativity framing.
  sources:
  - venue: AAAI
    area: 'CMS: Computational Creativity'
- name: Conceptual Inference and Reasoning
  definition: Covers reasoning over concepts and conceptual structures for inference tasks, excluding
    symbolic-only representation work covered under Symbolic Representations.
  sources:
  - venue: AAAI
    area: 'CMS: Conceptual Inference and Reasoning'
- name: Neural Spike Coding
  definition: Covers computational modeling and analysis of neural spike-based coding mechanisms, excluding
    broader Neuroscience and Cognitive Science in ML topics not focused on spike coding.
  sources:
  - venue: AAAI
    area: 'CMS: Neural Spike Coding'
- name: Simulating Human Behavior
  definition: Covers computational simulation of human behavioral patterns and decision processes, excluding
    social-interaction-specific modeling covered under Social Cognition and Interaction.
  sources:
  - venue: AAAI
    area: 'CMS: Simulating Human Behavior'
- name: Social Cognition and Interaction
  definition: Covers computational modeling of social cognitive processes and interactive social behavior,
    excluding general behavior simulation covered under Simulating Human Behavior.
  sources:
  - venue: AAAI
    area: 'CMS: Social Cognition And Interaction'
- name: Symbolic Representations in Cognitive Systems
  definition: Covers symbolic knowledge representation approaches within cognitive modeling, excluding
    architecture-level design covered under Computational Cognitive Architectures.
  sources:
  - venue: AAAI
    area: 'CMS: Symbolic Representations'
- name: Representation Learning for Vision
  definition: Covers learning visual feature representations for computer vision tasks, excluding modality-general
    representation learning methods not specific to vision.
  sources:
  - venue: AAAI
    area: 'CV: Representation Learning for Vision'
  - venue: CVPR
    area: Representation learning
  - venue: ICCV
    area: Representation learning
- name: Large Vision Models
  definition: Covers development and study of large-scale pretrained vision models, excluding general
    representation learning methods not focused on model scale.
  sources:
  - venue: AAAI
    area: 'CV: Large Vision Models'
- name: 3D Computer Vision
  definition: Covers 3D scene reconstruction, geometry, and related vision tasks, excluding 2D-only scene
    analysis covered under Scene Analysis and Understanding in Vision.
  sources:
  - venue: AAAI
    area: 'CV: 3D Computer Vision'
- name: Adversarial Attacks and Robustness in Vision
  definition: Covers adversarial attack, defense, and robustness methods specific to vision systems, excluding
    general ML robustness covered under Social and Trustworthy Aspects of Machine Learning.
  sources:
  - venue: AAAI
    area: 'CV: Adversarial Attacks & Robustness'
  - venue: CVPR
    area: Adversarial attack and defense
  - venue: ICCV
    area: Adversarial attack and defense
- name: Computer Vision Applications
  definition: Covers applied uses of computer vision techniques across domains, excluding domain-specific
    vision areas like Medical and Biological Imaging or Vision for Robotics and Autonomous Driving.
  sources:
  - venue: AAAI
    area: 'CV: Applications'
- name: Medical and Biological Imaging
  definition: Covers computer vision methods applied to medical and biological imagery including cell
    microscopy, excluding general Computer Vision Applications in other domains.
  sources:
  - venue: AAAI
    area: 'CV: Medical and Biological Imaging'
  - venue: CVPR
    area: Medical and biological vision, cell microscopy
  - venue: ICCV
    area: Medical and biological vision; cell microscopy
- name: Biometrics, Face, Gesture and Pose
  definition: Covers recognition and analysis of biometric signals including faces, gestures, and body
    pose, excluding general object detection covered under Object Detection and Categorization.
  sources:
  - venue: AAAI
    area: 'CV: Biometrics, Face, Gesture & Pose'
- name: Computational Photography and Visual Synthesis
  definition: Covers image and video synthesis and computational photography techniques, excluding Deep
    Generative Models and Autoencoders not specific to vision synthesis.
  sources:
  - venue: AAAI
    area: 'CV: Computational Photography, Image & Video Synthesis'
- name: Bias, Fairness and Privacy in Vision
  definition: Covers fairness, bias mitigation, and privacy concerns specific to computer vision systems,
    excluding general ML trustworthiness covered under Social and Trustworthy Aspects of Machine Learning.
  sources:
  - venue: AAAI
    area: 'CV: Bias, Fairness & Privacy'
- name: Interpretability and Explainability in Vision
  definition: Covers methods for explaining and interpreting vision model decisions, excluding general
    Visualization and Interpretation of Representations not specific to vision.
  sources:
  - venue: AAAI
    area: 'CV: Interpretability, Explainability, and Transparency'
  - venue: CVPR
    area: Explainable computer vision
  - venue: ICCV
    area: Explainable AI for CV
- name: Image and Video Retrieval
  definition: Covers retrieval of images and videos based on content or query, excluding general Datasets
    and Benchmarks topics not focused on retrieval methods.
  sources:
  - venue: AAAI
    area: 'CV: Image and Video Retrieval'
  - venue: ICCV
    area: 'Recognition: Retrieval'
- name: Vision and Language
  definition: Covers joint modeling of visual and linguistic information such as captioning and visual
    question answering, excluding pure Natural Language modality work outside vision context.
  sources:
  - venue: AAAI
    area: 'CV: Language and Vision'
  - venue: ICCV
    area: Vision and language
- name: Learning and Optimization for Computer Vision
  definition: Covers learning algorithms and optimization techniques tailored to computer vision problems,
    excluding general Optimization for Machine Learning not vision-specific.
  sources:
  - venue: AAAI
    area: 'CV: Learning & Optimization for CV'
- name: Low-Level and Physics-Based Vision
  definition: Covers low-level image processing and physics-based vision modeling such as reflectance
    and illumination, excluding high-level Scene Analysis and Understanding in Vision.
  sources:
  - venue: AAAI
    area: 'CV: Low Level & Physics-based Vision'
  - venue: ICCV
    area: Low-level and physics-based vision
- name: Motion and Tracking in Vision
  definition: Covers motion estimation, matching, and object tracking in video, excluding broader Video
    Understanding and Activity Analysis focused on action recognition.
  sources:
  - venue: AAAI
    area: 'CV: Motion & Tracking'
  - venue: CVPR
    area: 'Video: Low-level analysis, motion, and tracking'
  - venue: ICCV
    area: Motion estimation, matching and tracking
- name: Multi-modal Computer Vision
  definition: Covers vision methods integrating multiple sensory or data modalities beyond vision-language
    pairs, excluding the specific Vision and Language topic.
  sources:
  - venue: AAAI
    area: 'CV: Multi-modal Vision'
- name: Object Detection and Categorization
  definition: Covers detecting and classifying objects within images, excluding segmentation-level pixel
    labeling covered under Segmentation.
  sources:
  - venue: AAAI
    area: 'CV: Object Detection & Categorization'
- name: Scene Analysis and Understanding in Vision
  definition: Covers holistic interpretation of visual scenes including context and layout, excluding
    3D geometric reconstruction covered under 3D Computer Vision.
  sources:
  - venue: AAAI
    area: 'CV: Scene Analysis & Understanding'
  - venue: CVPR
    area: Scene analysis and understanding
  - venue: ICCV
    area: Scene analysis and understanding
- name: Segmentation in Computer Vision
  definition: Covers pixel-level and region-level segmentation of images and videos, excluding object-level
    detection covered under Object Detection and Categorization.
  sources:
  - venue: AAAI
    area: 'CV: Segmentation'
- name: Video Understanding and Activity Analysis
  definition: Covers recognition and understanding of actions and events in video, excluding low-level
    motion tracking covered under Motion and Tracking in Vision.
  sources:
  - venue: AAAI
    area: 'CV: Video Understanding & Activity Analysis'
  - venue: CVPR
    area: 'Video: Action and event understanding'
  - venue: ICCV
    area: Action and event understanding
- name: Vision for Robotics and Autonomous Driving
  definition: Covers computer vision techniques applied to robotic perception and autonomous vehicles,
    excluding general Mobility, Driving, and Flight applications outside vision methods.
  sources:
  - venue: AAAI
    area: 'CV: Vision for Robotics & Autonomous Driving'
- name: Visual Reasoning and Symbolic Representations
  definition: Covers reasoning over visual data using symbolic or structured representations, excluding
    general Neurosymbolic and Hybrid AI Systems not specific to vision.
  sources:
  - venue: AAAI
    area: 'CV: Visual Reasoning & Symbolic Representations'
- name: Constraint Satisfaction and Optimization Applications
  definition: Covers applied uses of constraint satisfaction and optimization techniques in real-world
    problems, excluding the general solving methods covered under Constraint Optimization or Constraint
    Programming.
  sources:
  - venue: AAAI
    area: 'CSO: Applications'
- name: Constraint Learning and Acquisition
  definition: Covers automatic learning or acquisition of constraints from data or examples, excluding
    manual Constraint Programming formulation.
  sources:
  - venue: AAAI
    area: 'CSO: Constraint Learning and Acquisition'
- name: Constraint Optimization
  definition: Covers optimization problems formulated with constraints seeking optimal solutions, excluding
    feasibility-only Constraint Satisfaction problems.
  sources:
  - venue: AAAI
    area: 'CSO: Constraint Optimization'
- name: Constraint Programming
  definition: Covers languages, frameworks, and techniques for modeling and solving problems via constraint
    programming paradigms, excluding satisfiability-specific methods under Satisfiability.
  sources:
  - venue: AAAI
    area: 'CSO: Constraint Programming'
- name: Constraint Satisfaction
  definition: Covers algorithms and theory for solving constraint satisfaction problems seeking feasible
    assignments, excluding optimization-focused Constraint Optimization.
  sources:
  - venue: AAAI
    area: 'CSO: Constraint Satisfaction'
- name: Distributed Constraint Satisfaction and Optimization
  definition: Covers distributed algorithms for solving constraint satisfaction and optimization problems
    across multiple agents, excluding centralized Constraint Optimization approaches.
  sources:
  - venue: AAAI
    area: 'CSO: Distributed CSP/Optimization'
- name: Mixed Discrete/Continuous Optimization
  definition: Covers optimization problems involving both discrete and continuous variables, excluding
    purely discrete Constraint Satisfaction or purely continuous Optimization for Machine Learning.
  sources:
  - venue: AAAI
    area: 'CSO: Mixed Discrete/Continuous Optimization'
- name: Satisfiability
  definition: Covers Boolean satisfiability (SAT) solving algorithms and theory, excluding extended theory-based
    solving under Satisfiability Modulo Theories.
  sources:
  - venue: AAAI
    area: 'CSO: Satisfiability'
- name: Satisfiability Modulo Theories
  definition: Covers solving satisfiability problems combined with background theories such as arithmetic,
    excluding pure propositional Satisfiability.
  sources:
  - venue: AAAI
    area: 'CSO: Satisfiability Modulo Theories'
- name: Search Algorithms for Constraint Solving
  definition: Covers search strategies and algorithms used in solving constraint and combinatorial problems,
    excluding dedicated Satisfiability or Satisfiability Modulo Theories solvers.
  sources:
  - venue: AAAI
    area: 'CSO: Search'
- name: Solvers and Tools for Constraint Problems
  definition: Covers software systems and toolkits implementing constraint and optimization solving, excluding
    theoretical Search Algorithms for Constraint Solving not tied to tool implementation.
  sources:
  - venue: AAAI
    area: 'CSO: Solvers and Tools'
- name: Anomaly and Outlier Detection
  definition: Covers methods for identifying rare, novel, or anomalous instances in data, excluding general
    data stream mining which focuses on continuous data processing.
  sources:
  - venue: AAAI
    area: 'DMKM: Anomaly/Outlier Detection'
- name: Data Mining Applications
  definition: Covers applied uses of data mining techniques to real-world problems and domains, excluding
    core algorithmic contributions covered by other data mining topics like rule mining.
  sources:
  - venue: AAAI
    area: 'DMKM: Applications'
- name: Conversational Recommendation and Retrieval
  definition: Covers interactive, dialogue-based systems for recommending items or retrieving information,
    excluding static recommender systems without conversational interaction.
  sources:
  - venue: AAAI
    area: 'DMKM: Conversational Systems for Recommendation & Retri'
- name: Data Compression
  definition: Covers techniques for reducing data size for storage or transmission, excluding data stream
    mining which addresses processing of continuous data flows.
  sources:
  - venue: AAAI
    area: 'DMKM: Data Compression'
- name: Data Stream Mining
  definition: Covers algorithms and methods for mining continuous, high-velocity data streams, excluding
    static or batch data mining tasks.
  sources:
  - venue: AAAI
    area: 'DMKM: Data Stream Mining'
- name: Data Visualization and Summarization
  definition: Covers techniques for visually representing and condensing data to reveal structure or insights,
    excluding interpretability methods for ML models found in vision-specific topics.
  sources:
  - venue: AAAI
    area: 'DMKM: Data Visualization & Summarization'
- name: Graph Mining and Social Network Analysis
  definition: Covers community detection, graph mining algorithms, and social network analysis, excluding
    graph-based machine learning model architectures covered elsewhere.
  sources:
  - venue: AAAI
    area: 'DMKM: Graph Mining, Social Network Analysis & Community'
- name: Intelligent Query Processing
  definition: Covers techniques for enhancing database query processing with intelligence and optimization,
    excluding semantic web topics focused on linked data representation.
  sources:
  - venue: AAAI
    area: 'DMKM: Intelligent Query Processing'
- name: Knowledge Acquisition from the Web
  definition: Covers extracting structured knowledge and information from web sources, excluding linked
    open data and knowledge graph completion methods.
  sources:
  - venue: AAAI
    area: 'DMKM: Knowledge Acquisition from  the Web'
- name: Linked Open Data, Knowledge Graphs and Knowledge Base Completion
  definition: Covers construction, linking, and completion of knowledge graphs and open data resources,
    excluding web-based knowledge acquisition as a distinct extraction-focused topic.
  sources:
  - venue: AAAI
    area: 'DMKM: Linked Open Data, Knowledge Graphs & KB Completio'
- name: Spatial, Temporal and Spatio-Temporal Data Mining
  definition: Covers mining patterns from spatial, temporal, or spatio-temporal datasets, excluding mining
    of visual or multimedia data covered separately.
