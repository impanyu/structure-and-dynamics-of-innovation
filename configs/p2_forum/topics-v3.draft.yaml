  - venue: CVPR
    area: Vision + graphics
  - venue: ICCV
    area: Vision and graphics
- name: Vision, Language, and Reasoning
  definition: Covers reasoning tasks combining visual and linguistic information, excluding generic multimodal
    learning not focused on reasoning.
