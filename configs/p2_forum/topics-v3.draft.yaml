  - venue: CVPR
    area: Self-& semi-& meta-& unsupervised learning
  - venue: ICCV
    area: Self-, semi-, meta-, unsupervised learning
- name: Transfer, Low-Shot, Continual, Long-Tail Learning in Vision
  definition: Covers vision-specific transfer learning, few-shot, continual, and long-tail recognition
    methods, excluding general transfer learning theory outside vision.
  sources:
  - venue: CVPR
    area: Transfer/ low-shot/ continual/ long-tail learning
  - venue: ICCV
    area: Transfer, low-shot, continual, long-tail learning
- name: Fairness, Privacy, Ethics and Transparency in Vision
  definition: Covers fairness, accountability, privacy, and ethical considerations specific to computer
    vision, excluding general AI ethics topics outside vision.
