  - venue: CVPR
    area: Segmentation, grouping and shape analysis
  - venue: ICCV
    area: Segmentation, grouping and shape analysis
- name: Self-, Semi-, Meta-, Unsupervised Learning in Vision
  definition: Covers vision-specific self-supervised, semi-supervised, meta-, and unsupervised learning
    methods, excluding supervised recognition approaches.
