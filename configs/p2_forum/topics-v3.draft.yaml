  - venue: CVPR
    area: Transparency, fairness, accountability, privacy and ethics in vision
  - venue: ICCV
    area: Fairness, privacy, ethics, social-good, transparency, accountability in vision
- name: Vision and Graphics
  definition: Covers the intersection of computer vision and computer graphics, excluding pure image/video
