# Official submission areas of the seven CCF-A AI venues, copied verbatim
# from each call for papers. Input to scripts/p2_forum/build_topic_list.py.
# Notes: AAAI uses the AAAI-25 keyword list (leaf keywords; one string each, as printed,
# including the page's own truncation 'CMS: Other Foundations of Cognitive Modeling & Syste').
# ACL list includes the special theme track as the last entry. ICCV URL is the call-for-papers page
# actually fetched (the one in the plan's table redirects to the submission-guidelines page).
venues:
  - venue: NeurIPS
    edition: "2024"
    url: https://neurips.cc/Conferences/2024/CallForPapers
    areas:
      - "Applications (e.g., vision, language, speech and audio, Creative AI)"
      - "Deep learning (e.g., architectures, generative models, optimization for deep networks, foundation models, LLMs)"
      - "Evaluation (e.g., methodology, meta studies, replicability and validity, human-in-the-loop)"
      - "General machine learning (supervised, unsupervised, online, active, etc.)"
      - "Infrastructure (e.g., libraries, improved implementation and scalability, distributed solutions)"
      - "Machine learning for sciences (e.g. climate, health, life sciences, physics, social sciences)"
      - "Neuroscience and cognitive science (e.g., neural coding, brain-computer interfaces)"
      - "Optimization (e.g., convex and non-convex, stochastic, robust)"
      - "Probabilistic methods (e.g., variational inference, causal inference, Gaussian processes)"
      - "Reinforcement learning (e.g., decision and control, planning, hierarchical RL, robotics)"
      - "Social and economic aspects of machine learning (e.g., fairness, interpretability, human-AI interaction, privacy, safety, strategic behavior)"
      - "Theory (e.g., control theory, learning theory, algorithmic game theory)"
  - venue: ICML
    edition: "2024"
    url: https://icml.cc/Conferences/2024/CallForPapers
    areas:
      - "General Machine Learning (active learning, clustering, online learning, ranking, reinforcement learning, supervised, semi- and self-supervised learning, time series analysis, etc.)"
      - "Deep Learning (architectures, generative models, deep reinforcement learning, etc.)"
      - "Learning Theory (bandits, game theory, statistical learning theory, etc.)"
      - "Optimization (convex and non-convex optimization, matrix/tensor methods, stochastic, online, non-smooth, composite, etc.)"
      - "Probabilistic Inference (Bayesian methods, graphical models, Monte Carlo methods, etc.)"
      - "Trustworthy Machine Learning (accountability, causality, fairness, privacy, robustness, etc.)"
      - "Applications (computational biology, crowdsourcing, healthcare, neuroscience, social good, climate science, etc.)"
  - venue: ICLR
    edition: "2024"
    url: https://iclr.cc/Conferences/2024/CallForPapers
    areas:
      - "unsupervised, self-supervised, semi-supervised, and supervised representation learning"
      - "transfer learning, meta learning, and lifelong learning"
      - "reinforcement learning"
      - "representation learning for computer vision, audio, language, and other modalities"
      - "metric learning, kernel learning, and sparse coding"
      - "probabilistic methods (Bayesian methods, variational inference, sampling, UQ, etc.)"
      - "generative models"
      - "causal reasoning"
      - "optimization"
      - "learning theory"
      - "learning on graphs and other geometries & topologies"
      - "societal considerations including fairness, safety, privacy"
      - "visualization or interpretation of learned representations"
      - "datasets and benchmarks"
      - "infrastructure, software libraries, hardware, etc."
      - "neurosymbolic & hybrid AI systems (physics-informed, logic & formal reasoning, etc.)"
      - "applications to robotics, autonomy, planning"
      - "applications to neuroscience & cognitive science"
      - "applications to physical sciences (physics, chemistry, biology, etc.)"
      - "general machine learning (i.e., none of the above)"
